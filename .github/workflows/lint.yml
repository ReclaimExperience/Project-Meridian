# Thin shim — the body lives in ci/lint.sh so it runs identically on a laptop
# (PRD 7.1, 7.3).
name: lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: extractions/setup-just@v3

      # Versions are pinned in ci/tool-versions.env. Ubuntu's apt shellcheck is
      # 0.9.0 and disagrees with current releases, which made `just lint` green
      # locally and red here on the same commit.
      - name: Install lint tools
        run: |
          set -euo pipefail
          source ci/tool-versions.env
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ --strip-components=1 -C /usr/local/bin "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          pipx install "ruff==${RUFF_VERSION}"
          python3 -m pip install --quiet --break-system-packages jsonschema
          npm install -g "markdownlint-cli@${MARKDOWNLINT_VERSION}" >/dev/null

      - name: Lint
        run: bash ci/lint.sh
