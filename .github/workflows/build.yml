# Thin shim — the body lives in ci/build.sh (PRD 7.1, 7.3).
name: build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          # [VERIFY] free arm64 runners for public repos (PRD 7.3). If this job
          # cannot get a runner, the pre-authorized fallback is a qemu
          # cross-build on nightly only — do not silently drop the arch.
          - arch: aarch64
            runner: ubuntu-24.04-arm

    name: build-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v5

      - uses: extractions/setup-just@v3

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman skopeo
          python3 -m pip install --quiet --break-system-packages jsonschema

      # An OS image does not fit on a hosted runner's root disk. See the script.
      - name: Prepare runner storage
        run: bash ci/prepare-runner.sh

      # BOTH stores, and the second one is not redundant.
      #
      # The build is rootful (see "Build and push"), so root needs the credentials
      # to push. But `check-no-test-user.sh` runs ROOTLESS and, now that the image
      # is no longer in the runner user's store, has to PULL the published image
      # to inspect it — which is what that check always claimed to do. Our
      # packages are not anonymously pullable, so without a rootless login that
      # pull fails and the check reports "could not obtain the image".
      #
      # Logging in rootful only is exactly the regression that produced a red
      # build-aarch64: the change that moved the build to root was reasoned about
      # in the half where the image is written, and not in the half where it is
      # read back.
      - name: Log in to GHCR
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          # --password-stdin: a token passed as -p is visible in /proc.
          echo '${{ secrets.GITHUB_TOKEN }}' | sudo podman login ghcr.io -u '${{ github.actor }}' --password-stdin
          echo '${{ secrets.GITHUB_TOKEN }}' | podman login ghcr.io -u '${{ github.actor }}' --password-stdin

      # PR images go to a throwaway pr-NNN tag; main goes to :testing. Nothing
      # here ever writes :stable — that is the weekly promote gate's job (7.5).
      - name: Compute push tag
        id: tag
        run: |
          image="$(python3 -c "import json;d=json.load(open('os/rootfs/usr/share/meridian/branding.json'));print(d['registry']['namespace']+'/'+d['registry']['image'])")"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "tag=${image}:pr-${{ github.event.number }}-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${image}:testing-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"
          fi

      # One invocation per job: it builds, then pushes and verifies the pushed
      # labels. Running the script twice rebuilt the whole image.
      #
      # Fork PRs get no GHCR credentials, so they build without pushing. ADR-014
      # makes this repo public, so fork PRs are a real path, not a hypothetical —
      # they must not fail on a push they were never able to perform.
      # Built ROOTFUL, and that is the whole point. bootc-image-builder refuses
      # to run rootless, so a rootless build has to be handed to root's store
      # before a disk image can be made — `podman save | sudo podman load` of an
      # 8.7 GiB stream, measured at 4m12s of a 25-minute job to move bytes that
      # were already on the disk. Building where the disk builder will look for
      # it costs nothing and removes the copy.
      #
      # `sudo env PATH=...` rather than `sudo -E`: `just` comes from setup-just
      # on the runner's PATH, but carrying the whole environment would also hand
      # root the runner user's HOME and therefore its containers.conf.
      - name: Build and push
        env:
          CAN_PUSH: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail
          if [ "$CAN_PUSH" = "true" ]; then
            sudo env "PATH=${PATH}" bash ci/build.sh ${{ matrix.arch }} --push '${{ steps.tag.outputs.tag }}'
          else
            echo "Fork pull request: building without pushing (no registry credentials)."
            echo "The pushed-label check therefore does not run for this PR."
            sudo env "PATH=${PATH}" bash ci/build.sh ${{ matrix.arch }}
          fi

      # PRD 7.3's vm-test row. `smoke`, `security` and `perf` gate a PR:
      #   - `security` was expected-red until WP-02, on the two ADR-015 defects
      #     the WP-03 harness found (LLMNR listening on 5355, and openssh-server
      #     shipping). WP-02 removed both, so it gates from here on — an
      #     expected-red suite that nobody promotes when it is fixed is just a
      #     suite that never has to pass, and PRD 7.5's promote-to-stable gate
      #     stays unsatisfiable while it sits in the nightly.
      #   - `perf` enforces PRD 2's budgets. It costs a boot plus a two-minute
      #     settle, which is the price of noticing idle RAM drift in the PR that
      #     causes it rather than a month later.
      #   - `screens` still needs x86_64 baselines, which must be created
      #     deliberately in their own commit (rule R-F) and do not exist yet;
      #   - `privacy` takes a 10-minute idle window by design.
      # Those two run nightly. Widening this list is how a suite stops being
      # advisory; narrowing it is how a gate stops being a gate.
      - name: Harness suites
        if: matrix.arch == 'x86_64'
        run: |
          sudo apt-get install -y -qq qemu-system-x86 ovmf
          python3 -m pip install --quiet --break-system-packages pillow numpy
          bash ci/vm-test.sh x86_64 smoke security perf

      # WP-03 acceptance: the harness logs in as `mtest`, so prove that account
      # is absent from the image that was actually PUSHED — not from a local
      # build of it.
      # BOTH arches. The VM suites are x86_64-only for runner cost, but this is
      # one `podman run` on a native runner — and build-aarch64 was a REQUIRED
      # check that pushed an image without a single assertion against it.
      - name: Published image carries no test credentials
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: bash ci/check-no-test-user.sh '${{ steps.tag.outputs.tag }}'

      - name: Upload harness evidence
        if: matrix.arch == 'x86_64' && always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-evidence-x86_64
          path: |
            build/evidence/*.png
            build/evidence/*.json
            build/evidence/serial-*.log
          if-no-files-found: warn
