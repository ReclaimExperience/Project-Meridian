# Thin shim — the body lives in ci/build.sh (PRD 7.1, 7.3).
name: build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          # [VERIFY] free arm64 runners for public repos (PRD 7.3). If this job
          # cannot get a runner, the pre-authorized fallback is a qemu
          # cross-build on nightly only — do not silently drop the arch.
          - arch: aarch64
            runner: ubuntu-24.04-arm

    name: build-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v5

      - uses: extractions/setup-just@v3

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman skopeo
          python3 -m pip install --quiet --break-system-packages jsonschema

      # An OS image does not fit on a hosted runner's root disk. See the script.
      - name: Prepare runner storage
        run: bash ci/prepare-runner.sh

      - name: Log in to GHCR
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          # --password-stdin: a token passed as -p is visible in /proc.
          echo '${{ secrets.GITHUB_TOKEN }}' | podman login ghcr.io -u '${{ github.actor }}' --password-stdin

      # PR images go to a throwaway pr-NNN tag; main goes to :testing. Nothing
      # here ever writes :stable — that is the weekly promote gate's job (7.5).
      - name: Compute push tag
        id: tag
        run: |
          image="$(python3 -c "import json;d=json.load(open('os/rootfs/usr/share/meridian/branding.json'));print(d['registry']['namespace']+'/'+d['registry']['image'])")"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "tag=${image}:pr-${{ github.event.number }}-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${image}:testing-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"
          fi

      # One invocation per job: it builds, then pushes and verifies the pushed
      # labels. Running the script twice rebuilt the whole image.
      #
      # Fork PRs get no GHCR credentials, so they build without pushing. ADR-014
      # makes this repo public, so fork PRs are a real path, not a hypothetical —
      # they must not fail on a push they were never able to perform.
      # Built ROOTLESS, deliberately, after an experiment that failed.
      #
      # Building as root would let ci/vm-test.sh skip an 8.7 GiB `podman save |
      # sudo podman load` — 4m12s of a 25-minute job spent moving bytes that were
      # already on the disk. That is a real saving and it is not worth it:
      # rootful builds cost two credential failures (the login moved with the
      # build, and the rootless credential check could no longer pull), and then
      # hung for 1h45m at the first RUN step on the x86_64 runner where the
      # rootless build takes under four minutes.
      #
      # Four minutes saved is not worth a build that does not finish. If this is
      # attempted again, the thing to work out first is why a rootful `RUN` step
      # stalls on a hosted runner whose root store is a bind mount onto /mnt.
      - name: Build and push
        env:
          CAN_PUSH: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail
          if [ "$CAN_PUSH" = "true" ]; then
            bash ci/build.sh ${{ matrix.arch }} --push '${{ steps.tag.outputs.tag }}'
          else
            echo "Fork pull request: building without pushing (no registry credentials)."
            echo "The pushed-label check therefore does not run for this PR."
            bash ci/build.sh ${{ matrix.arch }}
          fi

      # ADR-022's VERIFY, re-run on every build rather than trusted once.
      # It answers "can the client policy pin a keyless identity?" against the
      # containers-image actually present. The answer today is no, which put the
      # key-pair fallback in force; if a containers-image update changes it we
      # find out here instead of carrying a stale decision indefinitely.
      # Informational — it never fails the build, it reports.
      - name: ADR-022 signing-policy capability
        if: matrix.arch == 'x86_64'
        run: |
          sudo apt-get install -y -qq skopeo >/dev/null 2>&1 || true
          if command -v skopeo >/dev/null 2>&1; then
            bash ci/verify-signing-policy.sh || true
          else
            echo "::notice::skopeo unavailable; ADR-022 capability check skipped"
          fi

      # WP-03 acceptance: the harness logs in as `mtest`, so prove that account
      # is absent from the image that was actually PUSHED — not from a local
      # build of it.
      # BOTH arches. The VM suites are x86_64-only for runner cost, but this is
      # one `podman run` on a native runner — and build-aarch64 was a REQUIRED
      # check that pushed an image without a single assertion against it.
      - name: Published image carries no test credentials
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          # Verify the PUBLISHED artifact, not a local build wearing the same
          # tag. Root's store holds the image it just pushed, so without this the
          # check would inspect that and prove nothing about the registry.
          MERIDIAN_VERIFY_PUBLISHED: "1"
        run: bash ci/check-no-test-user.sh '${{ steps.tag.outputs.tag }}'

      - name: Upload harness evidence
        if: matrix.arch == 'x86_64' && always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-evidence-x86_64
          path: |
            build/evidence/*.png
            build/evidence/*.json
            build/evidence/serial-*.log
          if-no-files-found: warn

  # Signing runs as its OWN job, gated on the `release` Environment's required
  # reviewers (ADR-022). Two consequences, both intended:
  #
  #   * a human approves every signature, so a compromised workflow cannot sign
  #     on its own — which is the only thing that makes holding a private key
  #     tolerable after ADR-022's VERIFY ruled out keyless;
  #   * pull requests never reach it, so a fork PR cannot touch the key.
  #
  # main only. `:stable` is promoted by retag (PRD 7.5) and is signed as part of
  # that gate, not here.
  sign:
    name: sign
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: sigstore/cosign-installer@v3
      - name: Install skopeo
        run: sudo apt-get install -y -qq skopeo
      # ONE auth file that BOTH tools read, which is the whole point.
      #
      # cosign does not use the containers auth file. It resolves credentials
      # through go-containerregistry's keychain — $DOCKER_CONFIG/config.json or
      # ~/.docker/config.json — so `skopeo login` alone left cosign pushing
      # anonymously, and the signature upload failed with UNAUTHORIZED after the
      # signing itself had already succeeded.
      #
      # Writing skopeo's login into the docker config path gives cosign the
      # credentials it looks for, and REGISTRY_AUTH_FILE points skopeo at the
      # same file for the digest lookup and the negative test.
      - name: Log in to GHCR
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.docker"
          echo '${{ secrets.GITHUB_TOKEN }}' | skopeo login ghcr.io \
            -u '${{ github.actor }}' --password-stdin \
            --authfile "${HOME}/.docker/config.json"
      - name: Sign the published images
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          export REGISTRY_AUTH_FILE="${HOME}/.docker/config.json"
          image="$(python3 -c "import json;d=json.load(open('os/rootfs/usr/share/meridian/branding.json'));print(d['registry']['namespace']+'/'+d['registry']['image'])")"
          for arch in x86_64 aarch64; do
            bash ci/sign-image.sh "${image}:testing-${arch}"
          done

      # ADR-022's hard gate on the first :stable image. It runs here, right after
      # signing, because the useful moment to learn that enforcement does not
      # work is while the person who just approved the signature is still
      # watching — not weeks later at a promote gate.
      # ADR-022's hard gate on the first :stable image. It runs here, right after
      # signing, because the useful moment to learn that enforcement does not
      # work is while the person who just approved the signature is still
      # watching — not weeks later at a promote gate.
      #
      # The script finds its own unsigned reference: PRs build and push pr-* tags
      # but never reach this job, so one of those is an unsigned image inside our
      # namespace — which is what proves the RULE, as opposed to an out-of-scope
      # image, which only exercises the control.
      - name: Negative test — unsigned images must be refused
        run: |
          set -euo pipefail
          # skopeo reads the same file cosign was given, so the two tools cannot
          # disagree about whether we are logged in.
          export REGISTRY_AUTH_FILE="${HOME}/.docker/config.json"
          bash ci/negative-test-signing.sh
