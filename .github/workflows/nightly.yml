# Suites too slow, too strict, or too baseline-dependent for the PR gate
# (PRD 7.3 nightly rows). Thin shim: the bodies live in ci/.
name: nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      suites:
        # `security` is welcome here now: WP-02 fixed both ADR-015 defects and
        # it gates PRs, so it is no longer expected-red. It is not in the default
        # because the PR gate already runs it every time; this job's job is the
        # slow and baseline-dependent ones.
        description: "Space-separated suites to run"
        default: "smoke privacy"
      repeat:
        description: "Run the suite list N times (the WP-03 flaky-rate gate uses 10)"
        default: "1"

permissions:
  contents: read
  packages: write

jobs:
  nightly:
    name: nightly-x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: extractions/setup-just@v3

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman skopeo qemu-system-x86 ovmf
          python3 -m pip install --quiet --break-system-packages jsonschema PyYAML pillow numpy

      - name: Prepare runner storage
        run: bash ci/prepare-runner.sh

      - name: Log in to GHCR
        run: echo '${{ secrets.GITHUB_TOKEN }}' | podman login ghcr.io -u '${{ github.actor }}' --password-stdin

      # Three wrong fixes have been made to the container-store path by
      # reasoning about it. This prints what is actually true, so the next
      # failure is diagnosed from evidence rather than from a fourth guess.
      - name: Container store facts
        run: |
          echo "user  graphroot: $(podman info --format '{{ .Store.GraphRoot }}')"
          echo "root  graphroot: $(sudo env HOME=/root podman info --format '{{ .Store.GraphRoot }}')"
          echo "root  configfile: $(sudo env HOME=/root podman info --format '{{ .Store.ConfigFile }}')"
          echo "root  w/ explicit conf: $(sudo env HOME=/root \
            CONTAINERS_STORAGE_CONF=/etc/containers/storage-root.conf \
            podman info --format '{{ .Store.GraphRoot }}')"
          echo "--- configs root could be reading ---"
          for f in /etc/containers/storage.conf /root/.config/containers/storage.conf \
                   "$HOME/.config/containers/storage.conf"; do
            echo "== $f"; sudo cat "$f" 2>/dev/null || echo "   (absent)"
          done
          echo "--- mounts ---"
          findmnt -no SOURCE,TARGET /var/lib/containers/storage || echo "   (not a mount)"
          echo "--- store databases ---"
          sudo find /var/lib/containers/storage /mnt/containers -maxdepth 2 \
               -name 'libpod' -o -maxdepth 2 -name '*.db' 2>/dev/null | head

      - name: Build image
        run: bash ci/build.sh x86_64

      # Suites that MUST be green. PRD 7.5's promote-to-stable gate reads this
      # job ("nightly suites green 2 consecutive days"), so nothing
      # expected-to-fail belongs in it — a permanently red job hides the
      # regression it exists to catch.
      - name: Harness suites
        env:
          # Via env, not interpolated into the script body: a dispatch value
          # containing a quote would otherwise break out of the shell.
          SUITES: ${{ github.event.inputs.suites }}
          REPEAT: ${{ github.event.inputs.repeat }}
        run: |
          set -euo pipefail
          suites="${SUITES:-}"
          [ -n "$suites" ] || suites="smoke privacy"
          repeat="${REPEAT:-}"
          [ -n "$repeat" ] || repeat=1
          # shellcheck disable=SC2086
          bash ci/vm-test.sh x86_64 --repeat "$repeat" $suites

      # The ADR-015 advisory step that lived here is gone. It existed because
      # the security suite was red on two real defects (LLMNR on 5355, and
      # openssh-server shipping — issue #2) that WP-02 owned, and it said that
      # the day it went green was the day to promote it. WP-02 removed both, so
      # `security` now gates every PR in build.yml. Keeping a continue-on-error
      # copy here as well would mean a failure has a green place to land.

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-evidence-x86_64
          path: |
            build/evidence/*.png
            build/evidence/*.json
            build/evidence/serial-*.log
            build/evidence/*.pcap
          if-no-files-found: warn

  # WP-04's flagship (ADR-008): a bad update must undo itself.
  #
  # Nightly rather than per-PR, and deliberately: the drill costs several boots —
  # the sabotage image has to fail its health check three times before greenboot
  # rolls back — so it is minutes, not seconds. Per-PR it would be the slowest
  # gate by a wide margin and would push people to bypass it.
  #
  # It is a REQUIRED nightly job, not advisory. ADR-008's self-healing promise is
  # either mechanically true every night or it is not a promise.
  rollback-drill:
    name: rollback-drill
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5
      - uses: extractions/setup-just@v3
      - name: Install build tools
        run: |
          sudo apt-get install -y -qq qemu-system-x86 ovmf skopeo
          # The harness imports numpy and pillow for frame analysis. This job
          # did not install them, so every rollback drill died on
          # `ModuleNotFoundError: No module named 'numpy'` AFTER a full image
          # build — ten minutes spent to fail on a missing dependency. Same
          # class as the lint job that lacked pillow.
          python3 -m pip install --quiet --break-system-packages \
            jsonschema PyYAML pillow numpy
      - name: Prepare runner storage
        run: bash ci/prepare-runner.sh
      - name: Log in to GHCR
        run: |
          echo '${{ secrets.GITHUB_TOKEN }}' | podman login ghcr.io -u '${{ github.actor }}' --password-stdin
      - name: Build the image under test
        run: bash ci/build.sh x86_64
      - name: Build the disk image
        run: bash ci/vm-test.sh x86_64 smoke

      # CI is the authority on what ships; a local build is only an
      # accelerator. Publishing the disk here means the visual review and the
      # VM suites can run against the artifact that was actually built from
      # main, on a machine with no local privilege — and it unblocks anyone
      # without rootful podman, which bootc-image-builder requires and which a
      # dev box may reasonably not grant.
      #
      # Uploaded BEFORE the drill: the drill deliberately stages a sabotage
      # image and rolls back, so the disk it leaves behind is mutated boot
      # state, not a clean image.
      #
      # compression-level 0 because qcow2 is already zlib-compressed; zipping
      # it again spends minutes to save nothing. Retention is short because
      # the file is multi-gigabyte and a stale disk is worse than no disk.
      - name: Upload the bootable disk image
        uses: actions/upload-artifact@v4
        with:
          name: meridian-qcow2-x86_64
          path: build/qcow2/*.qcow2
          compression-level: 0
          retention-days: 5
          if-no-files-found: error

      - name: Rollback drill
        run: bash ci/rollback-drill.sh x86_64
      - name: Upload drill evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rollback-drill-evidence
          path: |
            build/evidence/*.json
            build/evidence/serial-*.log
          if-no-files-found: warn
