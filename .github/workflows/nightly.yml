# Suites too slow, too strict, or too baseline-dependent for the PR gate
# (PRD 7.3 nightly rows). Thin shim: the bodies live in ci/.
name: nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      suites:
        description: "Space-separated suites to run"
        default: "smoke privacy security"
      repeat:
        description: "Run the suite list N times (the WP-03 flaky-rate gate uses 10)"
        default: "1"

permissions:
  contents: read
  packages: write

jobs:
  nightly:
    name: nightly-x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: extractions/setup-just@v3

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman skopeo qemu-system-x86 ovmf
          python3 -m pip install --quiet --break-system-packages jsonschema PyYAML pillow numpy

      - name: Prepare runner storage
        run: bash ci/prepare-runner.sh

      - name: Log in to GHCR
        run: echo '${{ secrets.GITHUB_TOKEN }}' | podman login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: Build image
        run: bash ci/build.sh x86_64

      # Suites that MUST be green. PRD 7.5's promote-to-stable gate reads this
      # job ("nightly suites green 2 consecutive days"), so nothing
      # expected-to-fail belongs in it — a permanently red job hides the
      # regression it exists to catch.
      - name: Harness suites
        run: |
          set -euo pipefail
          suites='${{ github.event.inputs.suites }}'
          [ -n "$suites" ] || suites="smoke privacy"
          repeat='${{ github.event.inputs.repeat }}'
          [ -n "$repeat" ] || repeat=1
          # shellcheck disable=SC2086
          bash ci/vm-test.sh x86_64 --repeat "$repeat" $suites

      # ADR-015 compliance, tracked SEPARATELY because it is currently red for
      # real reasons that another work package owns: the image ships LLMNR on
      # 5355 and an sshd binary (issue #2). Kept out of the gating job above so
      # a genuine regression there stays visible, and kept visible here so the
      # day it goes green is the day that axis of WP-02 is done.
      #
      # NOT continue-on-error as a way of ignoring it: this step reports its own
      # result loudly and the job summary carries it.
      - name: ADR-015 compliance (expected RED until WP-02)
        id: adr015
        continue-on-error: true
        run: bash ci/vm-test.sh x86_64 security

      - name: Report ADR-015 status
        run: |
          if [ "${{ steps.adr015.outcome }}" = "success" ]; then
            echo "::notice::ADR-015 compliance is GREEN. If WP-02 has landed, move"
            echo "::notice::the security suite into the gating job and delete this one."
          else
            echo "::warning::ADR-015 still violated (expected until WP-02 — issue #2)."
            echo "::warning::PRD 7.5 promote-to-stable CANNOT be satisfied while this is red."
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-evidence-x86_64
          path: |
            build/evidence/*.png
            build/evidence/*.json
            build/evidence/serial-*.log
            build/evidence/*.pcap
          if-no-files-found: warn
