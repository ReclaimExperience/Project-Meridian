# ADR-015: no non-loopback listening sockets beyond the printing/discovery
# allowlist. systemd-resolved enables LLMNR by default, which listens on
# tcp+udp/5355 on every interface, IPv4 and IPv6 — four listeners more than the
# ADR permits. Found by the WP-03 harness (tests/security/ports.sh), issue #2.
#
# Nothing is lost: mDNS already covers local name resolution, and it is the
# protocol printers actually use. LLMNR is a Microsoft-era duplicate that is
# also a well-known credential-relay vector on untrusted networks — pillar 5
# says private *by architecture*, and a café network is where that gets tested.
[Resolve]
LLMNR=no
