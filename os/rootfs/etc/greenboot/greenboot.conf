# greenboot configuration (ADR-008).
#
# Three boots before a failing deployment is rolled back. Deliberately not 1: a
# single transient failure — a slow disk, a hardware quirk on first boot — would
# otherwise cost someone their update for no reason. Three is greenboot's own
# default and it is right here.
GREENBOOT_MAX_BOOT_ATTEMPTS=3

# 01_repository_dns_check.sh is DISABLED, and this is a deliberate product
# decision rather than a convenience.
#
# It resolves the domains in /etc/ostree/remotes.d and fails if they do not
# answer. On this image remotes.d IS populated, so on a machine with no network
# the check fails, and after three boots the machine ROLLS BACK a perfectly good
# update because nobody had joined the Wi-Fi yet.
#
# That is precisely backwards for this product. ADR-010 supports offline
# installation; a laptop sitting on a kitchen table before the owner has typed
# their Wi-Fi password is healthy, not broken. Our own check
# (10-meridian-desktop.sh) asks whether NetworkManager can start, not whether it
# is connected, for the same reason.
#
# A health check that punishes someone for being offline is worse than no check:
# it takes away the update they already installed, silently, and they will never
# learn why.
DISABLED_HEALTHCHECKS=("01_repository_dns_check.sh")
