# The single source of truth for RPM changes to the base image (PRD 6.2).
#
# The Containerfile consumes this file. A package name appearing anywhere else —
# an inline `dnf install` in the Containerfile, a build script, a Justfile recipe
# — fails CI lint. Greppability is auditability: "what is in this OS and why"
# must be answerable by reading one file.
#
# Removals are CODEOWNERS-gated (rule R-H): taking a package out can silently
# break a driver or codec path that only shows up on someone's real hardware.
# Every removal below therefore cites the ADR or PRD section that requires it.
#
# ADR-002 warning: never remove anything ublue's driver/codec stack provides,
# even when it looks unused in a VM. It is not unused on Pat's 2017 HP.

version: 1

# Packages layered on top of the base image.
#
# PRD 3.2 names the visible app set; these are the members the base does not
# already carry. Everything else a user wants is one click away in the store
# (ADR-004) — this list is deliberately hard to grow.
add:
  # --- the visible apps PRD 3.2 requires but the base lacks ----------------
  - gwenview          # Photos. Pat's phone photos have to open in something.
  - okular            # PDF. Boarding passes, bank statements, the school letter.
  - haruna            # Media. The video a nephew sends, playing without a codec hunt.
  - kcalc             # Calculator. Windows parity; nobody installs a calculator.
  - print-manager     # Printers page in Settings (PRD 5.6); WP-22 configures it.

  # --- update machinery (ADR-008); WP-04 configures it ---------------------
  - greenboot                    # boot health checks -> automatic rollback
  - greenboot-default-health-checks

# Packages removed from the base image.
#
# Two kinds: things an ADR forbids, and things PRD 3.2 leaves out. Both are
# listed with the authority, because "it looked like clutter" is not a reason to
# remove software from someone's computer.
remove:
  # --- forbidden by an ADR -------------------------------------------------
  - firefox            # ADR-004/ADR-010: the browser is a Flatpak, carried on the
                       # ISO sideload set. An RPM Firefox would shadow it and
                       # update on a different schedule than every other app.
  - plasma-discover    # ADR-004: "Discover's PackageKit backend is not shipped".
                       # WP-13's store replaces it.
  - openssh-server     # ADR-015: "no SSH daemon". Found by the WP-03 harness:
                       # installed but disabled, which is one `systemctl enable`
                       # from listening. Section 12 claims the browser is the only
                       # routine network-facing app; that is untrue while this ships.
  - krfb               # Desktop sharing = a VNC server. Same ADR-015 rule, and a
                       # far worse default than sshd on an untrusted network.
  - plasma-drkonqi     # ADR-011: no crash reporting of any kind. A crash dialogue
                       # offering to send a backtrace is exactly what pillar 5 says
                       # this system does not do.

  # --- PRD 3.2 leaves these out --------------------------------------------
  - plasma-welcome     # Named in 3.2's removal list. Also half of the double-OOBE
                       # the WP-03 harness found: Plasma's own wizard runs before
                       # ours (PRD 5.8) unless both of these go.
  - plasma-setup       # The other half. plasma-setup.service runs
                       # Before=display-manager.service and preempts SDDM entirely.
  - kde-connect        # PRD 15: KDE Connect is v2, not 1.0.
  - kate               # 3.2 names KWrite. Kate is the same job with an IDE's
                       # surface area; two text editors is one too many for pillar 4.
  - kde-partitionmanager  # Not in 3.2. A one-click disk editor in the launcher of a
                          # machine whose owner fears "breaking it" is a hazard, not
                          # a feature. Installer partitioning is WP-17's, gated.
  - kwalletmanager5    # Not in 3.2. Wallet management surfaces a concept the
                       # persona has no model for.
  - kinfocenter        # Not in 3.2. Settings -> About covers what Pat needs.
  - khelpcenter        # Not in 3.2. Our help is docs/help (WP-25), written for
                       # this product rather than for KDE in general.
  - kmenuedit          # Not in 3.2, and the Start menu is KIOSK-locked (WP-07).
  - kfind              # Not in 3.2. Search is the Start menu (ADR-016).
  - kcharselect        # Not in 3.2. Meta+. is the emoji picker (Appendix D).
  - kdebugsettings     # Not in 3.2. A developer tool in a consumer launcher.
  - kjournald          # Not in 3.2. Log browsing is Advanced-mode territory.
  - filelight          # Not in 3.2. Disk usage lives in Settings -> About.
  - firewall-config    # Not in 3.2. ADR-015 makes security invisible; a firewall
                       # editor invites exactly the tinkering it forbids.
  - nvtop              # Not in 3.2. A GPU monitor for a persona who does not know
                       # what a GPU is.
  - htop               # Not in 3.2. plasma-systemmonitor is the visible one, and
                       # htop needs the terminal that INV-0 says nobody must open.

# Systemd units masked or disabled in the image.
systemd:
  mask:
    # ADR-016: "Baloo is disabled and masked". Masked rather than removed —
    # kf6-baloo is a Plasma dependency, so removing it is dependency-locked.
    # This is the sanctioned alternative the WP names ("or masked if dep-locked
    # — record which"): recorded here.
    - baloo_file.service
  disable: []
